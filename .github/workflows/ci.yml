name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The one required check on main. Compiles the server and runs the JUnit suite: CRUD, flush,
  # compaction, tombstones, scans, WAL recovery and a torn WAL tail.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew build
