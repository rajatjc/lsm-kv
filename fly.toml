# Fly.io config. App names are global: change "app" if it's taken.
# The engine is single-node, so run exactly ONE machine with ONE volume.
app = "lsm-kv-rajatjc"
primary_region = "yyz" # Toronto

[env]
  DATA_DIR = "/data"
  MAX_DATA_MB = "100"

[[mounts]]
  source = "lsm_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb" # the JVM needs more headroom than 256 MB
